name: Build for Jellyfin 12.4
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish src/Jellyfin.Plugin.MediaBar/Jellyfin.Plugin.MediaBar.csproj -c Release -p:JellyfinVersion=12.4.0 -o out
      - run: cd out && zip ../MediaBar-12.4.0.zip Jellyfin.Plugin.MediaBar.dll Jellyfin.Plugin.MediaBar.deps.json Jellyfin.Plugin.MediaBar.pdb logo.png
      - uses: actions/upload-artifact@v4
        with:
          name: MediaBar-12.4.0
          path: MediaBar-12.4.0.zip
